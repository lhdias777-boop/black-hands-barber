services:
  postgres:
    image: postgres:16-alpine
    container_name: black-hands-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blackhands
      POSTGRES_PASSWORD: blackhands
      POSTGRES_DB: blackhands
    ports:
      - "5432:5432"
    volumes:
      - blackhands_pg:/var/lib/postgresql/data
volumes:
  blackhands_pg:
