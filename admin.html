<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Hands — Admin</title><link rel="stylesheet" href="styles.css"></head>
<body class="dashboard-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">BH</span><span><strong>BLACK HANDS</strong><small>ADMIN</small></span></a><button class="btn btn-small" id="logout">SAIR</button></header>
<main class="dashboard section"><div class="section-head"><div><p class="eyebrow">PAINEL ADMINISTRATIVO</p><h1 class="dash-title">Visão geral.</h1></div><p>Clientes, barbeiros e agenda central da Black Hands.</p></div>
<div class="dash-grid"><article class="dash-card"><small>CLIENTES</small><strong id="clients">0</strong><span>cadastrados</span></article><article class="dash-card"><small>BARBEIROS</small><strong id="barbers">0</strong><span>ativos</span></article><article class="dash-card"><small>AGENDAMENTOS</small><strong id="bookings">0</strong><span>futuros</span></article></div>
<section><h2 class="dash-subtitle">Agenda geral</h2><div id="agenda" class="booking-list"></div></section>
<section><h2 class="dash-subtitle">Clientes cadastrados</h2><div id="clientList" class="booking-list"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
let sb;const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());const todayISO=today.toISOString().slice(0,10);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function init(){if(!window.SUPABASE_URL?.startsWith('http'))return;sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:{user}}=await sb.auth.getUser();if(!user){location.href='index.html#authPanel';return;}const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();if(p?.role!=='admin'){document.body.innerHTML='<main class="section"><h1>Acesso restrito</h1><p>Somente o administrador pode acessar este painel.</p><a class="btn" href="index.html">VOLTAR</a></main>';return;}
const [{data:clients},{data:barbers},{data:appointments,error}]=await Promise.all([sb.from('profiles').select('id,full_name,phone,role').eq('role','client').order('full_name'),sb.from('barbers').select('*').eq('active',true),sb.from('appointments').select('id,appointment_date,appointment_time,status,profiles(full_name,phone),barbers(name),services(name)').neq('status','cancelled').gte('appointment_date',todayISO).order('appointment_date').order('appointment_time')]);
document.getElementById('clients').textContent=clients?.length||0;document.getElementById('barbers').textContent=barbers?.length||0;document.getElementById('bookings').textContent=appointments?.length||0;
document.getElementById('agenda').innerHTML=appointments?.length?appointments.map(a=>`<article class="booking-item"><strong>${esc(a.appointment_date)} • ${esc(a.appointment_time).slice(0,5)}</strong><span>${esc(a.profiles?.full_name)} — ${esc(a.services?.name)} — ${esc(a.barbers?.name)}</span><em>${esc(a.status)}</em></article>`).join(''):'<p>Nenhum agendamento futuro.</p>';
document.getElementById('clientList').innerHTML=clients?.length?clients.map(c=>`<article class="booking-item"><strong>${esc(c.full_name)}</strong><span>${esc(c.phone||'WhatsApp não informado')}</span><em>cliente</em></article>`).join(''):'<p>Nenhum cliente.</p>';if(error)console.error(error)}
document.getElementById('logout').onclick=async()=>{await sb?.auth.signOut();location.href='index.html';};init();
</script></body></html>
